<title>Missilo Prototype</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,400&family=Nunito:wght@500;700&display=swap">
<style>
/* Layout: one portrait screen and nothing else. On a wide display the stage is a phone-shaped column in the middle. */
:root{
  color-scheme: dark;
  --ink:#101a2a;        /* night paper */
  --paper:#e8dcc0;      /* cream gouache */
  --dim:#a3ab9f;
  --ochre:#e4a04a;      /* lamp light */
  --line:#33445c;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%}
body{background:#0a111c;color:var(--paper);font-family:var(--body);font-weight:500;font-size:15px;line-height:1.5;display:flex;justify-content:center;overflow:hidden;overscroll-behavior:none}
.stage{position:relative;height:100%;width:100%;max-width:520px;background:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:rgba(10,17,28,.5);text-align:center}
.ov .word{font-family:var(--display);font-weight:600;font-size:64px;line-height:1;margin:0}
.ov .word span{color:var(--ochre)}
.ov .big{font-family:var(--display);font-weight:600;font-size:96px;line-height:.9;margin:0;color:var(--ochre)}
.ov .sub{font-family:var(--display);font-style:italic;font-size:19px;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ochre);outline-offset:3px}
.go{font-family:var(--display);font-weight:600;font-size:26px;background:var(--ochre);color:#2a1a08;border:0;border-radius:999px;padding:11px 40px;min-height:52px}
.quiet{background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 20px;min-height:44px}
#pauseBtn{position:absolute;top:max(10px,env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;border:0;background:rgba(232,220,192,.1);display:flex;align-items:center;justify-content:center;gap:5px}
#pauseBtn i{width:4px;height:15px;background:var(--paper);border-radius:2px;opacity:.75}
.carry{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-width:300px;width:100%;text-align:left;max-height:40%;overflow-y:auto}
.carry li{display:flex;gap:10px;align-items:baseline;font-size:14px}
.carry b{font-family:var(--display);font-weight:600;font-size:17px;white-space:nowrap}
.carry span{color:var(--dim)}
</style>

<div class="stage" id="stage">
  <canvas id="game" aria-label="Missilo. Tap the sky to fire. Tap a balloon to look at it, tap it again to take it."></canvas>
  <button id="pauseBtn" aria-label="Pause" hidden><i></i><i></i></button>
  <div class="ov" id="ovTitle"><p class="word">Missil<span>o</span></p><button class="go" id="startBtn">Begin</button></div>
  <div class="ov" id="ovEnd" hidden><p class="big" id="endBig"></p><p class="sub" id="endSub"></p><button class="go" id="againBtn">Again</button></div>
  <div class="ov" id="ovPause" hidden><ul class="carry" id="carry"></ul><button class="go" id="resumeBtn">Resume</button><button class="quiet" id="muteBtn">Sound: on</button></div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const stage = $('#stage'), cv = $('#game'), c = cv.getContext('2d');
// World: planet at the origin, y up. VIEW is the half-width shown; the screen is taller than it is wide.
const RP = 88, RH = 158, RS = 238, VIEW = 300, GM = 400000, WH = .055, WSUN = .06, SDT = .05, TAU = Math.PI*2;
const P = {sky0:'#2a4560', sky1:'#16233a', sky2:'#0e1726', paper:'#e8dcc0', cream:'#fff3d6', sage:'#3f6f6a', moss:'#86a98d', moss2:'#6f9a79', ochre:'#e4a04a', glow:'#ffc35c', coral:'#d9654b', plum:'#8a5a86', rose:'#e08aa0', rock:'#5a3f5e', dusk:'#4a5563', slate:'#394350', teal:'#4f8f8a'};
const ROOFS = [P.coral, P.ochre, P.rose, P.coral, P.teal, P.ochre];
let CW = 390, CH = 760, DPR = 1, KC = .65, K = .65;
const rnd = (a,b) => a + Math.random()*(b-a), clamp = (v,a,b) => Math.max(a, Math.min(b,v)), lerp = (a,b,t) => a+(b-a)*t, cos = Math.cos, sin = Math.sin;
const wrap = a => { while (a>Math.PI) a -= TAU; while (a<-Math.PI) a += TAU; return a; };
const hash = i => { const x = sin(i*127.1+311.7)*43758.5453; return x-Math.floor(x); };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- what a balloon can carry: data only. A shot is BASE folded through everything taken. ---------- */
const BASE = {speed:430, radius:44, cells:6, recharge:.85, count:1, echo:0, well:0};
const ITEMS = {
  wide: {col:P.coral, name:'Wide Charge', says:'bigger blasts',                 ops:[['radius','mul',1.3]]},
  twin: {col:P.moss,  name:'Twin',        says:'one more shot with every tap',  ops:[['count','add',1]]},
  echo: {col:P.plum,  name:'Echo',        says:'every blast goes off again',    ops:[['echo','add',1]]},
  wick: {col:P.ochre, name:'Long Wick',   says:'beads refill faster',           ops:[['recharge','mul',.68]]},
  bead: {col:P.rose,  name:'Two Beads',   says:'two more shots to hold',        ops:[['cells','add',2]]},
  swift:{col:P.teal,  name:'Tailwind',    says:'shots fly faster',              ops:[['speed','mul',1.4]]},
  well: {col:P.sage,  name:'Whirlpool',   says:'blasts pull things in',         ops:[['well','add',1]]},
  match:{col:P.glow,  name:'Match',       says:'relights a dark house'},
};
function compose(){ const sp = {...BASE}; for (const k of sat.items) for (const [key,op,v] of ITEMS[k].ops||[]) sp[key] = op==='mul' ? sp[key]*v : sp[key]+v; sat.sp = sp; }

/* ---------- state ---------- */
const g = {state:'title', night:1, time:0, rot:0, hrot:0, sh:-Math.PI/2, waveT:0, lullT:0, queue:[], foes:[], shots:[], blooms:[], bits:[], wells:[], parcels:[], ripples:[],
  shake:0, flash:0, dawn:0, dark:0, paused:false, id:0, endT:0, deny:0, boss:null, sel:null, cap:null, taught:false};
const sat = {ang:1.2, w:Math.sqrt(GM/(RS*RS*RS)), x:0, y:0, charge:6, tick:0, dead:0, recoil:0, sun:true, items:[], sp:{...BASE}};
let houses = [];
function place(){ sat.x = RS*cos(sat.ang); sat.y = RS*sin(sat.ang); }
// The sun swings slowly overhead, so the planet's shadow sweeps from side to side below it. g.sh is the direction the shadow points.
const inShadow = (x,y) => { const cs = cos(g.sh), sn = sin(g.sh); return x*cs+y*sn>0 && Math.abs(-x*sn+y*cs)<RP; };
const hAng = h => h.th + g.hrot, hPos = h => [RH*cos(hAng(h)), RH*sin(hAng(h))];
const lit = () => houses.filter(h => h.on);
function newRun(){ houses = [0,1,2,3,4,5].map(i => ({i,th:i*TAU/6+.3,on:true,seed:i*7.3})); sat.items = []; compose(); Object.assign(sat,{charge:sat.sp.cells,tick:0,dead:0});
  Object.assign(g,{night:1,queue:[],foes:[],shots:[],blooms:[],wells:[],parcels:[],ripples:[],boss:null,dark:0,dawn:0,endT:0,sel:null,cap:null}); }

/* ---------- audio ---------- */
let ac = null, master = null, muted = false;
function audioInit(){ if (ac) { if (ac.state==='suspended') ac.resume(); return; }
  try { ac = new (window.AudioContext||window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = .5; master.connect(ac.destination); } catch(e){ ac = null; } }
function tone(f, d, type, v, to){ if (!ac || muted) return; const t = ac.currentTime, o = ac.createOscillator(), a = ac.createGain();
  o.type = type||'sine'; o.frequency.setValueAtTime(f,t); if (to) o.frequency.exponentialRampToValueAtTime(to,t+d);
  a.gain.setValueAtTime(v||.2,t); a.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(a); a.connect(master); o.start(t); o.stop(t+d+.02); }
let noiseBuf = null;
function noise(d, v, fc, to){ if (!ac || muted) return; if (!noiseBuf){ noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const ch = noiseBuf.getChannelData(0); for (let i=0;i<ch.length;i++) ch[i] = Math.random()*2-1; }
  const t = ac.currentTime, n = ac.createBufferSource(), f = ac.createBiquadFilter(), a = ac.createGain(); n.buffer = noiseBuf; f.type='lowpass'; f.frequency.setValueAtTime(fc,t); if (to) f.frequency.exponentialRampToValueAtTime(to,t+d);
  a.gain.setValueAtTime(v,t); a.gain.exponentialRampToValueAtTime(.001,t+d); n.connect(f); f.connect(a); a.connect(master); n.start(t); n.stop(t+d+.02); }
const PENTA = [0,3,5,7,10];
const sfx = {
  launch(){ noise(.22,.09,1800,500); tone(440,.14,'triangle',.05,300); },
  burst(){ tone(160,.3,'sine',.2,55); noise(.2,.1,800,200); },
  kill(n){ const i = Math.min(n-1,14); tone(330*Math.pow(2,(PENTA[i%5]+12*Math.floor(i/5))/12),.34,'triangle',.15); },
  impact(){ tone(90,.6,'sine',.32,30); noise(.5,.2,500,80); },
  dark(){ tone(300,.9,'sawtooth',.08,60); },
  empty(){ tone(140,.07,'square',.05); tone(110,.09,'square',.04); },
  cell(n){ tone(660+n*70,.07,'sine',.03); },
  crack(){ tone(520,.12,'square',.05,240); noise(.12,.08,1200,300); },
  shield(){ tone(900,.25,'sine',.04,1300); },
  look(){ tone(700,.1,'triangle',.07); tone(1050,.16,'sine',.04); },
  dawn(){ [392,523,659].forEach((f,i) => setTimeout(() => tone(f,.9,'sine',.09),i*140)); },
  take(){ [523,659,784,1047].forEach((f,i) => setTimeout(() => tone(f,.3,'triangle',.1),i*70)); },
  fall(){ tone(220,2.4,'sawtooth',.1,40); noise(2.2,.18,900,60); },
  win(){ [392,494,587,784,988].forEach((f,i) => setTimeout(() => tone(f,1.4,'triangle',.11),i*130)); noise(1.2,.2,300,2600); },
};

/* ---------- incoming: real gravity paths from the screen edge, aimed at where a house will be ---------- */
const TYPE = {streak:{m:1,hp:1,col:P.coral,r:7}, split:{m:.85,hp:1,col:P.plum,r:10}, orbit:{m:1.05,hp:1,col:P.rose,r:8}, dart:{m:1,hp:1,col:P.cream,r:6}, heavy:{m:.7,hp:2,col:P.ochre,r:14}};
const v0 = () => Math.min(84, 38+7*g.night);
const edge = (a, pad) => { const hw = CW/2/KC+pad, hh = CH/2/KC+pad, t = Math.min(hw/Math.abs(cos(a)||1e-6), hh/Math.abs(sin(a)||1e-6)); return [t*cos(a), t*sin(a)]; };
function simCross(x,y,vx,vy,drag){ let t = 0;
  for (let i=0;i<1000;i++){ const r2 = x*x+y*y, r = Math.sqrt(r2); if (r<=RH) return {a:Math.atan2(y,x),t}; if (r>1300) return null;
    const k = -GM/(r2*r)*SDT; vx += x*k; vy += y*k; if (drag && r<340){ vx *= 1-drag*SDT; vy *= 1-drag*SDT; } x += vx*SDT; y += vy*SDT; t += SDT; }
  return null; }
// Threats come down the long axis of the screen so there is always time to see them: mostly from below, out of the dark side.
const spawnAngle = () => Math.random()<.78 ? clamp(g.sh+rnd(-.7,.7), -Math.PI/2-.85, -Math.PI/2+.85) : Math.PI/2+rnd(-.85,.85);
function launch(type, ang){
  const def = TYPE[type], sp = v0()*def.m, [x,y] = edge(ang,30), px = -sin(ang), py = cos(ang), L = lit(), tgt = L.length ? L[Math.random()*L.length|0] : null;
  const drag = type==='orbit' ? .3 : 0, vel = b => { const dx = px*b-x, dy = py*b-y, d = Math.hypot(dx,dy); return [dx/d*sp, dy/d*sp]; };
  const err = b => { const [vx,vy] = vel(b), hit = simCross(x,y,vx,vy,drag); return (hit && tgt) ? Math.abs(wrap(hit.a-(tgt.th+g.hrot+WH*hit.t))) : 9; };
  let best = 0, be = 9; for (const b0 of (drag ? [330,360,390,-330,-360,-390] : [-300,-225,-150,-75,0,75,150,225,300])){ const e = err(b0); if (e<be){ be = e; best = b0; } }
  for (let step=36;step>3;step/=2) for (const b of [best-step,best+step]){ const e = err(b); if (e<be){ be = e; best = b; } }
  if (Math.random()<.22) best += rnd(-70,70);
  const [vx,vy] = vel(best); g.foes.push({id:++g.id,type,x,y,vx,vy,hp:def.hp,drag,splitR:rnd(300,360),flash:0,age:0,seed:rnd(0,9)});
}
function buildNight(n){
  const q = [], end = 17+Math.min(8,n); let t = 1;
  while (t<end){ const r = Math.random(), a = spawnAngle(); let kind = 'fan';
    if (n>=5 && r<.14) kind = 'heavy'; else if (n>=4 && r<.3) kind = 'dart'; else if (n>=3 && r<.48) kind = 'orbit'; else if (n>=2 && r<.66) kind = 'split';
    if (kind==='fan'){ const k = 1+Math.min(4,(n+1)>>1)+(Math.random()<.4?1:0); for (let i=0;i<k;i++) q.push({t:t+i*.22,type:'streak',a:a+rnd(-.08,.08)}); }
    else if (kind==='split'){ for (let i=0;i<(n>=4?2:1);i++) q.push({t:t+i*.6,type:'split',a:a+i*.3}); }
    else if (kind==='orbit'){ for (let i=0;i<(n>=5?2:1);i++) q.push({t:t+i*.7,type:'orbit',a:spawnAngle()}); }
    else if (kind==='dart'){ for (let i=0;i<(n>=6?2:1);i++) q.push({t:t+i*.5,type:'dart',a:(Math.random()<.5?1:-1)*Math.PI/2+rnd(-.8,.8)}); }
    else { q.push({t,type:'heavy',a}); for (let i=1;i<4;i++) q.push({t:t+1.8+i*.25,type:'streak',a:a+rnd(-.12,.12)}); }
    t += Math.max(1.5, 3.6-.3*n)+rnd(0,.6); }
  q.sort((a,b) => a.t-b.t); return q;
}

/* ---------- the lantern's shots ---------- */
function segDist(px,py,ax,ay,bx,by){ const dx = bx-ax, dy = by-ay, t = clamp(((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy||1),0,1); return Math.hypot(px-(ax+dx*t),py-(ay+dy*t)); }
function stepShot(m, dt){
  let tx = m.tx, ty = m.ty; const SP = m.speed;
  if (segDist(0,0,m.x,m.y,tx,ty) < RP+14){ const am = Math.atan2(m.y,m.x), d = wrap(Math.atan2(ty,tx)-am), wa = am+(d<0?-1:1)*.55, wr = Math.max(RP+50, Math.min(Math.hypot(m.x,m.y),Math.hypot(tx,ty))); tx = wr*cos(wa); ty = wr*sin(wa); }
  const dx = tx-m.x, dy = ty-m.y, d = Math.hypot(dx,dy)||1, ax = (dx/d*SP-m.vx)*7, ay = (dy/d*SP-m.vy)*7, al = Math.hypot(ax,ay), lim = SP*5, k = al>lim ? lim/al : 1;
  const r = Math.hypot(m.x,m.y), gk = -GM/(r*r*r);
  m.vx += (ax*k+m.x*gk)*dt; m.vy += (ay*k+m.y*gk)*dt; m.x += m.vx*dt; m.y += m.vy*dt; m.t += dt;
  if (Math.hypot(m.x,m.y) < RP+1) return 'block';
  if (Math.hypot(m.tx-m.x,m.ty-m.y) < Math.max(7,SP*dt*1.2) || m.t>6) return 'burst';
  return 'fly';
}
function clampAim(x,y){ const r = Math.hypot(x,y)||1, k = Math.max(r,RP+16)/r; return [x*k,y*k]; }
function fire(x, y){
  if (!['play','lull','boss','fall'].includes(g.state) || g.paused) return;
  if (sat.dead>0 || sat.charge<1){ sfx.empty(); g.deny = .35; return; }
  [x,y] = clampAim(x,y); sat.charge--; sat.recoil = 1;
  const sp = sat.sp, n = sp.count, a = Math.atan2(y,x), ox = -sin(a)*sp.radius*1.5, oy = cos(a)*sp.radius*1.5, chain = {count:0};
  for (let i=0;i<n;i++){ const k = i-(n-1)/2, [tx,ty] = clampAim(x+ox*k,y+oy*k);
    g.shots.push({x:sat.x,y:sat.y,vx:-sin(sat.ang)*sat.w*RS,vy:cos(sat.ang)*sat.w*RS,tx,ty,t:0,speed:sp.speed,trail:[],chain}); }
  sfx.launch();
}
function bloom(x,y,max,gen,chain,opt){ g.blooms.push(Object.assign({x,y,max,gen,chain,t:0,delay:0,hold:.4,hit:new Set(),bossHit:false,r:0,harmless:false,pulses:0,seed:rnd(0,9)}, opt||{})); }
function afterBurst(x,y){ if (sat.sp.well) g.wells.push({x,y,t:0,life:3,str:sat.sp.well}); }
function bits(x,y,n,col,sp,big){ if (g.bits.length>500) return; for (let i=0;i<n;i++){ const a = rnd(0,TAU), v = rnd(.25,1)*sp; g.bits.push({x,y,vx:cos(a)*v,vy:sin(a)*v,life:rnd(.4,1),max:1,col,s:rnd(2,4.5)*(big||1),rot:rnd(0,TAU)}); } }
function killFoe(e, b){
  const def = TYPE[e.type];
  if (e.hp>1){ e.hp--; e.flash = 1; sfx.crack(); bits(e.x,e.y,8,P.cream,110); return false; }
  b.chain.count++; const gen = b.gen+1, heavy = e.type==='heavy';
  bloom(e.x,e.y,heavy ? 84 : [40,31,25,20][Math.min(gen-1,3)],gen,b.chain,{delay:.07,hold:heavy?.55:.32});
  bits(e.x,e.y,heavy?28:10,def.col,150); sfx.kill(b.chain.count);
  if (heavy){ g.shake = Math.max(g.shake,8); sfx.impact(); } if (b.chain.count>=3) g.shake = Math.max(g.shake, Math.min(b.chain.count+1,7));
  return true;
}
function houseDown(h){
  h.on = false; const [x,y] = hPos(h); bloom(x,y,34,0,{count:0},{harmless:true,hold:.25,angry:true}); bits(x,y,26,P.glow,190); bits(x,y,10,P.coral,140);
  sfx.impact(); sfx.dark(); g.shake = Math.max(g.shake,9); g.flash = .45;
  if (!lit().length && g.state!=='fall' && g.state!=='boss'){ g.state = 'fall'; g.endT = 0; g.queue = []; g.sel = null; sfx.fall(); for (const p of g.parcels) p.state = 'leave';
    for (const f of g.foes) bits(f.x,f.y,6,TYPE[f.type].col,80); g.foes = []; }
}

/* ---------- flow: night, dawn and balloons, night ... then the fall ---------- */
function startNight(){ g.state = 'play'; g.waveT = 0; g.sel = null; g.queue = buildNight(g.night); for (const p of g.parcels) if (p.state!=='take') p.state = 'leave'; }
function dawn(){ g.night++; g.state = 'lull'; g.lullT = 22; g.dawn = 1; g.sel = null; sfx.dawn(); sat.charge = sat.sp.cells;
  const L = lit().sort(() => Math.random()-.5).slice(0,3); let pool = Object.keys(ITEMS).filter(k => k!=='match' || houses.some(h => !h.on));
  for (const h of L){ const k = pool.splice(Math.random()*pool.length|0,1)[0], [x,y] = hPos(h), a = hAng(h), rr = Math.min(RS+26, CW/2/KC-34)/Math.max(Math.abs(cos(a)),.55); const r2 = Math.min(rr, RS+70);
    g.parcels.push({kind:k,x,y,tx:cos(a)*r2,ty:sin(a)*r2,t:0,state:'rise',seed:rnd(0,9),a:1}); } }
function take(p){ p.state = 'take'; g.sel = null; g.lullT = 1.8; sfx.take(); g.cap = {kind:p.kind,t:0,life:3.2}; for (const o of g.parcels) if (o!==p && o.state!=='take') o.state = 'leave'; }
function apply(k){ if (k==='match'){ const d = houses.find(h => !h.on); if (d){ d.on = true; const [x,y] = hPos(d); bits(x,y,20,P.glow,120); } }
  else { sat.items.push(k); const before = sat.sp.cells; compose(); if (sat.sp.cells>before) sat.charge = sat.sp.cells; } bits(sat.x,sat.y,18,ITEMS[k].col,130); }
function begin(){ audioInit(); newRun(); hide(); $('#pauseBtn').hidden = false; g.state = 'lull'; g.lullT = 1.8; }
function hide(){ for (const id of ['ovTitle','ovEnd','ovPause']) $('#'+id).hidden = true; }
function showEnd(win){ hide(); $('#pauseBtn').hidden = true; const n = g.night-1; $('#endBig').textContent = win ? 'Dawn' : n; $('#endSub').textContent = win ? (n===1 ? 'after one night' : 'after '+n+' nights') : (n===1 ? 'night' : 'nights'); $('#ovEnd').hidden = false; }
function spawnBoss(){ const [x,y] = edge(clamp(g.sh+rnd(-.2,.2),-Math.PI/2-.6,-Math.PI/2+.6),95), T = 25; g.boss = {x,y,vx:-x/T,vy:-y/T,r:92,hp:48,max:48,flash:0,cracks:[],seed:rnd(0,9),shed:2.5,dead:0}; g.state = 'boss'; }

function update(dt){
  g.time += dt; if (g.paused || g.state==='end') return;
  g.rot += .05*dt; g.hrot += WH*dt; g.sh = -Math.PI/2 + .95*sin(g.time*WSUN*1.8); sat.ang += sat.w*dt; place(); sat.recoil = Math.max(0, sat.recoil-dt*5); g.deny = Math.max(0, g.deny-dt); g.dawn = Math.max(0, g.dawn-dt*.5);
  if (g.cap){ g.cap.t += dt; if (g.cap.t>g.cap.life) g.cap = null; }

  glow(0,0,RP*1.5,'rgba(120,190,200,.5)',.22);
  blob(0,0,RP,1.3+bo*.9,.012); c.fillStyle = lost ? '#2b3a44' : P.sage; c.fill(); c.save(); c.clip();
  for (let i=0;i<7;i++){ const a = i*.95+g.rot, rr = RP*(.3+hash(i+40)*.38); blob(cos(a)*rr,sin(a)*rr,RP*(.16+hash(i)*.17),i*2.1,.13,22); c.fillStyle = lost ? '#3a4a50' : (i%2 ? P.moss : P.moss2); c.fill(); }
  c.fillStyle = 'rgba(255,243,214,.5)'; for (let i=0;i<5;i++){ const a = i*1.3+g.rot*1.6; c.beginPath(); c.ellipse(cos(a)*RP*.55,sin(a)*RP*.55,RP*.16,RP*.05,a+1.2,0,TAU); c.fill(); }   // clouds
  c.save(); c.rotate(g.sh); { const gr = c.createLinearGradient(-RP,0,RP,0); gr.addColorStop(0,'rgba(255,243,214,.36)'); gr.addColorStop(.42,'rgba(255,243,214,0)'); gr.addColorStop(.55,'rgba(8,14,24,.2)'); gr.addColorStop(1,'rgba(8,14,24,.74)'); c.fillStyle = gr; c.fillRect(-RP*1.1,-RP*1.1,RP*2.2,RP*2.2);
    c.strokeStyle = 'rgba(232,220,192,.16)'; c.lineWidth = 2.4; for (let i=0;i<7;i++){ c.beginPath(); c.arc(-RP*.25,0,RP*(.22+i*.11),2.5+i*.08,3.6+i*.05); c.stroke(); } } c.restore();
  c.restore(); c.strokeStyle = 'rgba(255,243,214,.55)'; c.lineWidth = 2.4; c.beginPath(); c.arc(0,0,RP,g.sh+Math.PI-1,g.sh+Math.PI+1); c.stroke();

  for (const hh of houses) house(hh);

  const B = g.boss;
  if (B && (!B.dead || B.dead<.5)){ const sd = B.seed+bo*.6, hurt = 1-B.hp/B.max; glow(B.x,B.y,B.r*2.1,'rgba(217,101,75,.9)',.18+hurt*.35);
    blob(B.x,B.y,B.r,sd,.045,44); c.fillStyle = B.flash>0 ? '#9a7088' : P.rock; c.fill(); c.strokeStyle = P.coral; c.lineWidth = 3; c.globalAlpha = .7; c.stroke(); c.globalAlpha = 1; c.save(); c.clip();
    c.globalAlpha = .5; c.fillStyle = '#0b0a14'; c.beginPath(); c.arc(B.x+cs*B.r*.75,B.y+sn*B.r*.75,B.r*1.05,0,TAU); c.fill(); c.globalAlpha = .16; c.fillStyle = P.paper; c.beginPath(); c.arc(B.x-cs*B.r*.85,B.y-sn*B.r*.85,B.r*.95,0,TAU); c.fill(); c.globalAlpha = 1;
    for (let i=0;i<7;i++){ blob(B.x+cos(i*1.7)*B.r*.55,B.y+sin(i*2.3)*B.r*.55,B.r*(.1+hash(i)*.12),i,.2,12); c.fillStyle = 'rgba(0,0,0,.25)'; c.fill(); }
    glow(B.x,B.y,B.r*(.3+hurt*.7),'rgba(255,195,92,.95)',hurt*.8);
    c.strokeStyle = P.glow; c.lineJoin = 'round'; for (const k of B.cracks){ c.lineWidth = 3.4; c.globalAlpha = .9; const x0 = B.x+cos(k.a)*B.r, y0 = B.y+sin(k.a)*B.r, mid = k.a+k.bend, x1 = B.x+cos(mid)*B.r*(1-k.len*.5), y1 = B.y+sin(mid)*B.r*(1-k.len*.5), x2 = B.x+cos(k.a-k.bend*.6)*B.r*(1-k.len), y2 = B.y+sin(k.a-k.bend*.6)*B.r*(1-k.len);
      c.beginPath(); c.moveTo(x0,y0); c.lineTo(x1,y1); c.lineTo(x2,y2); c.stroke(); c.lineWidth = 1.8; c.beginPath(); c.moveTo(x1,y1); c.lineTo(x1+cos(mid+1.3)*B.r*k.br*.4,y1+sin(mid+1.3)*B.r*k.br*.4); c.stroke(); }
    c.restore(); c.globalAlpha = 1; }

  // incoming: chalk comets
  for (const e of g.foes){ const def = TYPE[e.type], sp = Math.hypot(e.vx,e.vy)||1, ux = e.vx/sp, uy = e.vy/sp, tl = Math.min(e.type==='dart'?80:64, e.age*sp), fade = clamp(e.age*2.5,0,1), r = def.r;
    c.strokeStyle = def.col; c.lineWidth = r*.6; c.setLineDash([6,7]); for (const k of [-1,0,1]){ c.globalAlpha = fade*(k ? .3 : .65); c.beginPath(); c.moveTo(e.x-ux*tl*(k?.75:1)-uy*k*r*.7,e.y-uy*tl*(k?.75:1)+ux*k*r*.7); c.lineTo(e.x,e.y); c.stroke(); } c.setLineDash([]); c.globalAlpha = fade;
    blob(e.x,e.y,r,e.seed+bo,.1,14); c.fillStyle = e.flash>0 ? P.cream : def.col; c.fill(); c.fillStyle = P.cream; c.globalAlpha = fade*.7; c.beginPath(); c.arc(e.x-ux*r*.2,e.y-uy*r*.2,r*.32,0,TAU); c.fill();
    if (e.type==='heavy' && e.hp>1){ c.strokeStyle = P.cream; c.lineWidth = 2; c.globalAlpha = fade*.8; c.beginPath(); c.arc(e.x,e.y,r*1.5,0,TAU); c.stroke(); }
    if (e.type==='split'){ c.fillStyle = P.plum; for (let i=0;i<3;i++){ const a = g.time*3+i*TAU/3; c.beginPath(); c.arc(e.x+cos(a)*r*1.6,e.y+sin(a)*r*1.6,r*.3,0,TAU); c.fill(); } }
    c.globalAlpha = 1; }

  for (const m of g.shots){ const t = m.trail; c.fillStyle = P.cream; for (let i=0;i<t.length;i+=2){ c.globalAlpha = .25+.7*i/t.length; c.beginPath(); c.arc(t[i],t[i+1],2,0,TAU); c.fill(); } c.globalAlpha = 1; c.beginPath(); c.arc(m.x,m.y,4,0,TAU); c.fill(); }

  // the lantern: cap, glass and flame, a ring of beads, and the charms it has collected trailing behind
  const dead = sat.dead>0, on = sat.sun && !dead, deny = g.deny>0 || dead, s = 11*(1+.18*sat.recoil);
  for (let i=0;i<sat.items.length;i++){ const a = sat.ang-.105*(i+1)-.05, x = RS*cos(a)+sin(g.time*2+i)*1.5, y = RS*sin(a)+cos(g.time*2.3+i)*1.5; c.fillStyle = ITEMS[sat.items[i]].col; c.beginPath(); c.arc(x,y,8.5,0,TAU); c.fill(); c.save(); c.translate(x,y); glyph(sat.items[i],5.6); c.restore(); }
  glow(sat.x,sat.y,s*6,'rgba(228,160,74,.95)',on ? .5+.06*sin(g.time*9) : .13);
  c.save(); c.translate(sat.x,sat.y); c.rotate(sat.ang-Math.PI/2);
  c.strokeStyle = P.paper; c.lineWidth = 2; c.beginPath(); c.arc(0,s*1.55,s*.5,0,Math.PI); c.stroke();
  c.fillStyle = P.paper; c.beginPath(); c.moveTo(-s*.75,s*.95); c.lineTo(-s*.45,s*1.5); c.lineTo(s*.45,s*1.5); c.lineTo(s*.75,s*.95); c.fill(); c.fillRect(-s*.7,-s*1.2,s*1.4,s*.3);
  c.fillStyle = deny ? P.coral : (on ? P.ochre : '#7d6038'); c.beginPath(); c.moveTo(-s*.62,-s*.9); c.lineTo(-s*.78,s*.95); c.lineTo(s*.78,s*.95); c.lineTo(s*.62,-s*.9); c.fill();
  c.fillStyle = on ? P.cream : '#b9a37a'; const fl = on ? .5+.06*sin(g.time*11) : .28; c.beginPath(); c.moveTo(0,s*(fl*1.5-.2)); c.quadraticCurveTo(s*fl,-s*.1,0,-s*.55); c.quadraticCurveTo(-s*fl,-s*.1,0,s*(fl*1.5-.2)); c.fill();
  c.restore();
  const N = sat.sp.cells; for (let i=0;i<N;i++){ const a = g.time*.7+i/N*TAU, full = i<sat.charge, next = i===sat.charge && on, rr = 27, x = sat.x+cos(a)*rr, y = sat.y+sin(a)*rr;
    c.fillStyle = deny ? P.coral : P.glow; c.globalAlpha = full ? 1 : next ? .55 : .2; c.beginPath(); c.arc(x,y,full ? 3.8 : next ? 1.8+1.8*sat.tick/sat.sp.recharge : 1.8,0,TAU); c.fill(); } c.globalAlpha = 1;

  // balloons from the houses. The one you are looking at swells and shows its string to the lantern.
  for (const p of g.parcels){ const it = ITEMS[p.kind], sel = g.sel===p, bob = sin(g.time*2+p.seed)*4, x = p.x, y = p.y+bob, r = (p.state==='take' ? 18 : 28)*(sel ? 1.18+.05*sin(g.time*6) : 1), al = clamp(p.a,0,1)*clamp(p.t*2,0,1); c.globalAlpha = al;
    const rr = Math.hypot(x,y)||1; c.strokeStyle = P.paper; c.lineWidth = 1.6; c.beginPath(); c.moveTo(x-x/rr*r,y-y/rr*r); c.quadraticCurveTo(x-x/rr*r*1.8+sin(g.time*3+p.seed)*5,y-y/rr*r*1.8,x-x/rr*r*2.5,y-y/rr*r*2.5); c.stroke();
    if (sel){ c.setLineDash([3,8]); c.globalAlpha = al*.7; c.beginPath(); c.moveTo(x,y); c.lineTo(sat.x,sat.y); c.stroke(); c.setLineDash([]); c.globalAlpha = al; c.lineWidth = 2.4; c.strokeStyle = P.cream; c.beginPath(); c.arc(x,y,r+7,0,TAU); c.stroke(); }
    glow(x,y,r*2.3,'rgba(255,243,214,.8)',sel ? .4 : .22); blob(x,y,r,p.seed,.04,22); c.fillStyle = it.col; c.fill(); c.globalAlpha = al*.3; c.fillStyle = P.cream; c.beginPath(); c.arc(x-r*.38,y+r*.4,r*.26,0,TAU); c.fill(); c.globalAlpha = al;
    c.save(); c.translate(x,y); glyph(p.kind,r*.6,p.kind==='match'||p.kind==='wick' ? '#3a2408' : P.cream); c.restore(); c.globalAlpha = 1; }

  for (const b of g.blooms) if (b.delay<=0 && b.r>0) paintBloom(b);
  for (const p of g.bits){ c.globalAlpha = clamp(p.life/p.max*1.6,0,1); c.fillStyle = p.col; c.save(); c.translate(p.x,p.y); c.rotate(p.rot); c.fillRect(-p.s*.5,-p.s*.3,p.s,p.s*.6); c.restore(); } c.globalAlpha = 1;

  c.setTransform(1,0,0,1,0,0);
  if (g.flash>0){ c.fillStyle = `rgba(217,101,75,${g.flash*.3})`; c.fillRect(0,0,w,h); }
  if (g.state==='lost'){ c.fillStyle = `rgba(10,8,18,${clamp(g.endT/2.6,0,1)*.6})`; c.fillRect(0,0,w,h); }
  if (grainPat){ c.globalAlpha = .09; c.globalCompositeOperation = 'overlay'; c.fillStyle = grainPat; c.fillRect(0,0,w,h); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1; }
  if (g.sel) caption(g.sel.kind, 1, !g.taught); else if (g.cap) caption(g.cap.kind, clamp(g.cap.t*5,0,1)*clamp((g.cap.life-g.cap.t)*2,0,1), false);
}

/* ---------- sizing, input, loop ---------- */
function resize(){
  const r = stage.getBoundingClientRect(); if (!r.width || !r.height) return;
  CW = r.width; CH = r.height; DPR = Math.min(2, window.devicePixelRatio||1); KC = Math.min(CW, CH*.72)/2/VIEW; K = KC*DPR;
  cv.width = Math.round(CW*DPR); cv.height = Math.round(CH*DPR); paintBg();
}
function toWorld(e){ const r = cv.getBoundingClientRect(); return [(e.clientX-r.left-r.width/2)/KC, -(e.clientY-r.top-r.height/2)/KC]; }
cv.addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); if (g.paused) return; const [x,y] = toWorld(e);
  let best = null, bd = Math.max(40, 30/KC); for (const p of g.parcels){ if (p.state!=='rise' || p.t<.5) continue; const d = Math.hypot(p.x-x,p.y-y); if (d<bd){ bd = d; best = p; } }
  if (best){ if (g.sel===best){ g.taught = true; take(best); } else { g.sel = best; sfx.look(); } return; }
  if (g.sel){ g.sel = null; return; }                            // tapping away puts a balloon down without wasting a shot
  fire(x,y); });
addEventListener('keydown', e => { if (e.target.tagName==='BUTTON') return; const k = e.key.toLowerCase(); if (k==='p' || k==='escape') togglePause(); });
function togglePause(force){ if (!['play','lull','boss','fall'].includes(g.state)) return; g.paused = force==null ? !g.paused : force;
  if (g.paused){ const n = {}; for (const k of sat.items) n[k] = (n[k]||0)+1; $('#carry').innerHTML = Object.keys(n).map(k => `<li><b style="color:${ITEMS[k].col==='#3f6f6a' ? P.moss : ITEMS[k].col}">${ITEMS[k].name}${n[k]>1 ? ' ×'+n[k] : ''}</b><span>${ITEMS[k].says}</span></li>`).join(''); }
  $('#ovPause').hidden = !g.paused; }
$('#startBtn').onclick = begin; $('#againBtn').onclick = begin;
$('#resumeBtn').onclick = () => togglePause(false); $('#pauseBtn').onclick = () => togglePause();
$('#muteBtn').onclick = () => { muted = !muted; $('#muteBtn').textContent = 'Sound: '+(muted?'off':'on'); };
document.addEventListener('visibilitychange', () => { if (document.hidden) togglePause(true); });

newRun(); place(); new ResizeObserver(resize).observe(stage); resize();
let last = performance.now();
function frame(now){ const dt = Math.min(.05,(now-last)/1000); last = now; update(dt); paint(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
window.__missilo = {g, sat, fire, take, apply, houseDown, ITEMS, get houses(){return houses;}, get KC(){return KC;}};
})();
</script>
